<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>_________🚗___________</title>
    <link rel="stylesheet" href="/assets/styles/styles.css">
</head>

<body>
    <section class="hero" id="hero">
        <div class="home" id="home">
            <div class="image__wrapper">
                <img src="/assets/jeep.png">
            </div>
            <div class="ui-controls">
                <button id="startButton" class="button __primary">Start</button>
                <button id="startButton" class="button __secondary">How to play?</button>
            </div>
            <div class="copyright">
                Made with💡by <a class="link" href="https://www.ronanscotet.com" target="_blank">RONAN SCOTET</a>
            </div>
            <div id="authSection" class="authSection skeleton"></div>
            <div class="leaderboard" id="leaderboard">
                <h2>🏆 Leaderboard</h2>
                <ul class="leaderboard-list">
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                    <li class="skeleton-row"></li>
                </ul>
            </div>
        </div>
    </section>

    <div class="ui-game" id="ui-game">
        <div id="coinCounter">
            Coins collected: <span class="coinCount" id="coinCount">0</span>🪙
        </div>
        <div id="timerContainer">
            Timer: <span id="timer" class="timer">000</span>
        </div>
    </div>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
