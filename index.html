<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>_________🚗___________</title>
    <link rel="stylesheet" href="/assets/styles/styles.css">
</head>

<body>
    <section class="hero" id="hero">
        <div class="home" id="home">
            <div class="image__wrapper">
                <img src="/assets/jeep.png">
            </div>
            <div class="ui-controls">
                <button id="startButton" class="button __primary">Start</button>
                <button id="startButton" class="button __secondary">How to play?</button>
            </div>
            <div class="copyright">
                Made with💡by <a class="link" href="https://www.ronanscotet.com" target="_blank">RONAN SCOTET</a>
            </div>
            <div id="authSection" class="authSection"></div>
        </div>
    </section>

    <div id="coinCounter" style="position: fixed; top: 10px; left: 10px; font-size: 24px; color: white;">
        Coins collected: <span id="coinCount">0</span>
    </div>
    <div id="timerContainer" style="position: fixed; top: 30px; left: 10px; font-size: 24px; color: white;">
        Timer: <span id="timer">0</span>
    </div>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div id="endGamePopup"
        style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8); color: white; padding: 20px; font-size: 20px; border-radius: 10px; text-align: center;">
        <h2>Félicitations !</h2>
        <p>Vous avez collecté toutes les pièces en <span id="finalTime">0</span> secondes.</p>
        <button onclick="window.location.reload()">Recommencer</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
